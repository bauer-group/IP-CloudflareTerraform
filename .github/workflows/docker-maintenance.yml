# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (every ecosystem)
# =============================================================================
# Every Dependabot PR reaches this workflow (no paths: filter), so each one
# gets an explicit decision and annotation instead of silently staying open.
# A patch or minor update (majors stay open; a 0.x minor counts as major)
# is merged only after the pull_request run of docker-release.yml passed
# on its head commit - the image build (with the plugin's pytest gate) and
# both backup round trips:
#
#   docker          src/cloudflare-backup/Dockerfile      the image is built
#   pip             src/cloudflare-backup/pyproject.toml  pip install + pytest
#                                                         in the image build
#   github-actions  .github/workflows/**                  never merged: a CI
#                                                         change
#
# A PR whose files do not start docker-release.yml stays open as "not
# tested". A merge made with the GITHUB_TOKEN starts no push workflow, so
# after the merge this workflow dispatches docker-release.yml on main and
# waits for it (release-workflow). That run validates, round-trips and
# builds the merged commit again and only then:
# 1. Creates a semantic release (fix(docker) / fix(deps) -> PATCH)
# 2. Builds and pushes the new cloudflare-backup image
# A release run that does not succeed turns this job red.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image and runs the backup round trip. Its pull_request
      # paths (src/**) cover the Dockerfile and pyproject.toml Dependabot
      # updates in src/cloudflare-backup/.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
