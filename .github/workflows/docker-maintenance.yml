# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (every ecosystem)
# =============================================================================
# Every Dependabot PR reaches this workflow (no paths: filter), so each one
# gets an explicit decision and annotation instead of silently staying open.
# A patch update is merged only after the pull_request run of
# docker-release.yml passed on its head commit - the image build (with the
# plugin's pytest gate) and both backup round trips:
#
#   docker          src/cloudflare-backup/Dockerfile      the image is built
#   pip             src/cloudflare-backup/pyproject.toml  pip install + pytest
#                                                         in the image build
#   github-actions  .github/workflows/**                  never merged: a CI
#                                                         change
#
# A PR whose files do not start docker-release.yml stays open as "not
# tested". The merge is made with GITHUB_TOKEN and starts no push workflow,
# so after a merge - and only then - docker-release.yml is dispatched on
# main and waited for: it validates and round-trips the merged main again,
# releases it (fix(docker) / fix(deps) commits cut a patch release) and
# only then builds and pushes the image. A release run that does not
# succeed turns this job red.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites
  statuses: read        # commit statuses
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image and runs the backup round trip. Its pull_request
      # paths (src/**) cover the Dockerfile and pyproject.toml Dependabot
      # updates in src/cloudflare-backup/.
      required-workflows: '.github/workflows/docker-release.yml'
      # Release the merged update: dispatched on main after the merge, its
      # run awaited (release-wait-minutes, default 60; a run takes 5-10 min).
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
