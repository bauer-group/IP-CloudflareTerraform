# =============================================================================
# Release & Docker Build
# =============================================================================
# Single pipeline (mirrors the CS-* fleet): validate → backup round trip →
# semantic-release → build & push the cloudflare-backup image to GHCR → sync
# the Dockerfile version.
# Replaces a standalone semantic-release workflow so there is exactly one release
# path on main.
# =============================================================================

name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - 'tests/backup-roundtrip/**'
      - '.github/workflows/docker-release.yml'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main.
  attestations: write
  id-token: write
  actions: read

jobs:
  # ============================================
  # Validation
  # ============================================
  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.yml"]'
      env-file: '.env.example'

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  # ============================================
  # Backup round trip (gates every release)
  # ============================================
  # Builds cloudflare-backup from this commit and runs it against a mock of the
  # Cloudflare API over TLS (tests/backup-roundtrip/docker-compose.ci.yml),
  # with the plugin's curated default resource types at zone and account
  # scope: seeds a TXT record, a ruleset rule and a zone setting in the third
  # zone, backs up, changes all three behind the backup's back, restores the
  # zone with `cloudflare apply --force` and checks that they are back. The
  # mock's request journal must also show the token on every request, every
  # curated type asked for, the lists paginated, the rulesets listed by
  # cf-terraforming's legacy client through the mock, no write by the backup
  # and no restore change but the tampered resources; `cloudflare drift` must
  # report exactly the tampered files and the zone and account must plan
  # without changes after the restore. Every release rebuilds the image FROM
  # the newest BackupHelper engine - also the one the base image monitor
  # dispatches - so this runs on every push, dispatch and relevant PR.
  # Docs-only pushes never reach it (paths-ignore). The second job below runs
  # the same cycle as an upgrade with an off-site copy; the release needs both.
  backup-roundtrip:
    name: 🧪 Backup Round Trip
    needs: [validate-compose, validate-scripts]
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-files: '["docker-compose.yml", "tests/backup-roundtrip/docker-compose.ci.yml"]'
      # The CA and certificate of the mock's TLS endpoint, new for every run.
      prepare-script: 'tests/backup-roundtrip/prepare.sh'
      # The mock serves every curated default type (data for some, empty lists
      # for the rest), so the export runs with the plugin's built-in curated
      # list at both scopes - schema discovery would ask for ~250 types. A
      # generated token is the only one the mock accepts.
      env-overrides: |
        STACK_NAME=cloudflare_roundtrip
        CLOUDFLARE_API_BASE_URL=https://cf-mock:8443/client/v4
        CLOUDFLARE_RESOURCE_DISCOVERY=curated
        CLOUDFLARE_RESOURCE_SCOPE=all
      generated-secrets: 'CLOUDFLARE_API_TOKEN'
      build-images: '[{"service": "cf-backup", "context": "src/cloudflare-backup"}]'
      backup-service: 'cf-backup'
      require-components: 'cloudflare'
      # The engine's own restore does not push to Cloudflare; the plugin's
      # plan-gated apply does (--force: no terminal for the approval).
      restore-command: 'cloudflare apply'
      restore-args: '--zone charlie.example --force'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
    secrets: inherit

  # The way production gets there: the latest release's cf-backup starts
  # against the mock, the seed runs and the snapshot is taken - also to an S3
  # bucket (a throwaway MinIO). Then cf-backup is upgraded to the image built
  # from this commit like an operator does (image switched, compose up -d);
  # the seeded data must be untouched, the new sidecar healthy with the old
  # snapshot and the zone and account must plan without changes from it.
  # After the tamper the sidecar's data volume is wiped like on a new host,
  # and the new sidecar restores the old snapshot from S3 with
  # `cloudflare apply`. One compose file, so no variant matrix.
  backup-roundtrip-upgrade:
    name: 🧪 Backup Round Trip (upgrade, S3)
    needs: [validate-compose, validate-scripts]
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-files: '["docker-compose.yml", "tests/backup-roundtrip/docker-compose.ci.yml"]'
      prepare-script: 'tests/backup-roundtrip/prepare.sh'
      env-overrides: |
        STACK_NAME=cloudflare_roundtrip
        CLOUDFLARE_API_BASE_URL=https://cf-mock:8443/client/v4
        CLOUDFLARE_RESOURCE_DISCOVERY=curated
        CLOUDFLARE_RESOURCE_SCOPE=all
      generated-secrets: 'CLOUDFLARE_API_TOKEN'
      build-images: '[{"service": "cf-backup", "context": "src/cloudflare-backup"}]'
      backup-service: 'cf-backup'
      require-components: 'cloudflare'
      restore-command: 'cloudflare apply'
      restore-args: '--zone charlie.example --force'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
      # cf-backup starts as the latest release (vX.Y.Z -> image tag X.Y.Z)
      # and is upgraded to this commit's build; cf-mock is no release image.
      upgrade-from: 'latest-release'
      # setting VARIABLE: the .env variables docker-compose.yml builds the
      # S3 destination from.
      s3-destination: true
      s3-env: |
        endpoint   BACKUP_S3_ENDPOINT
        bucket     BACKUP_S3_BUCKET
        access-key BACKUP_S3_ACCESS_KEY
        secret-key BACKUP_S3_SECRET_KEY
        path-style BACKUP_S3_FORCE_PATH_STYLE
      artifact-name: 'backup-roundtrip-upgrade-diagnostics'
    secrets: inherit

  # ============================================
  # Release (only on main push / dispatch)
  # ============================================
  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, validate-scripts, backup-roundtrip, backup-roundtrip-upgrade]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.backup-roundtrip.result == 'success' &&
      needs.backup-roundtrip-upgrade.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # cloudflare-backup (meta image on the BackupHelper engine)
  # ============================================
  docker-build-cloudflare-backup-release:
    name: 🐳 Build & Push cloudflare-backup
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/IP-CloudflareTerraform/cloudflare-backup'
      docker-image-name: 'bauergroup/ip-cloudflareterraform-cloudflare-backup'
      release-version: ${{ needs.release.outputs.version }}
      build-args: |
        IMAGE_VERSION=${{ needs.release.outputs.version }}
      image-tags: 'stable'
      # The OCI version label is set at build time via the IMAGE_VERSION build-arg;
      # the Dockerfile default is written back by sync-dockerfile-versions below.
      update-dockerfile-version: false
      auto-tags: true
      latest-tag: true
      dockerfile-path: './src/cloudflare-backup/Dockerfile'
      docker-context: './src/cloudflare-backup'
      platforms: 'linux/amd64'
      push: true
      generate-sbom: true
      sync-dockerhub-readme: true
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  docker-build-cloudflare-backup-pr:
    name: 🔨 Validate cloudflare-backup Build (PR)
    needs: [validate-compose, validate-scripts]
    if: github.event_name == 'pull_request'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/IP-CloudflareTerraform/cloudflare-backup'
      auto-tags: true
      dockerfile-path: './src/cloudflare-backup/Dockerfile'
      docker-context: './src/cloudflare-backup'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Dockerfile version write-back
  # ============================================
  sync-dockerfile-versions:
    name: 🔖 Sync Dockerfile Versions
    needs:
      - release
      - docker-build-cloudflare-backup-release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔖 Write release version into Dockerfiles
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          DOCKERFILES=(
            src/cloudflare-backup/Dockerfile
          )
          for df in "${DOCKERFILES[@]}"; do
            sed -i -E "s/^(ARG IMAGE_VERSION=).*/\1${VERSION}/" "$df"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "${DOCKERFILES[@]}"; then
            echo "ℹ️ Dockerfile versions already at ${VERSION} — nothing to commit"
            exit 0
          fi

          git add "${DOCKERFILES[@]}"
          git commit -m "chore: synced Dockerfile versions to ${VERSION} [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "✅ Synced Dockerfile versions to ${VERSION}"
              exit 0
            fi
            echo "⚠️ push attempt ${attempt} failed — retrying..."
            sleep 5
          done
          echo "::error::failed to push Dockerfile version sync after 3 attempts"
          exit 1
