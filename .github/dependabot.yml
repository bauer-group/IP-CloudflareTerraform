# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors GitHub Actions, Docker base images and Python deps for updates.
# Combined with docker-maintenance.yml for auto-merge and check-base-images.yml
# for digest-pinned upstream tracking on floating tags.
#
# The commit prefix decides whether a merged update is released: fix(...)
# cuts a PATCH release and rebuilds the image, chore(...) releases nothing.
# Everything that ends up in the shipped image uses fix(...):
#   docker          -> fix(docker)  base images of cloudflare-backup
#   pip             -> fix(deps)    the plugin installed into the image
#                      (chore(deps-dev) for development dependencies)
#   github-actions  -> chore(ci)    no release, never auto-merged
# =============================================================================

version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:15"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # ── Docker base images (FROM tag bumps: backuphelper + opentofu) ───────────
  - package-ecosystem: "docker"
    directory: "/src/cloudflare-backup"
    schedule: { interval: "weekly", day: "sunday", time: "14:15", timezone: "Etc/UTC" }
    labels: ["dependencies", "docker", "dependabot"]
    commit-message:
      prefix: "fix(docker)"

  # ── Python dependencies (plugin) ──────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/src/cloudflare-backup"
    versioning-strategy: increase-if-necessary
    schedule: { interval: "weekly", day: "sunday", time: "14:15", timezone: "Etc/UTC" }
    labels: ["dependencies", "python", "dependabot"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
