# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors GitHub Actions, Docker base images and Python deps for updates.
# Combined with docker-maintenance.yml for auto-merge and check-base-images.yml
# for digest-pinned upstream tracking on floating tags.
#
# The commit-message prefix decides whether a merged update is released
# (docker-maintenance.yml dispatches docker-release.yml after the merge):
#   fix(docker) / fix(deps)  change the shipped cloudflare-backup image
#                            -> PATCH release, image rebuilt and pushed
#   chore(deps-dev)          Python deps Dependabot classes as development
#                            -> no release
#   chore(ci)                GitHub Actions -> no release, merged by hand
# =============================================================================

version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # ── Docker base images (FROM tag bumps: backuphelper + opentofu) ───────────
  - package-ecosystem: "docker"
    directory: "/src/cloudflare-backup"
    schedule: { interval: "weekly", day: "sunday", time: "06:30", timezone: "Etc/UTC" }
    labels: ["dependencies", "docker", "dependabot"]
    commit-message:
      prefix: "fix(docker)"

  # ── Python dependencies (plugin) ──────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/src/cloudflare-backup"
    versioning-strategy: increase-if-necessary
    schedule: { interval: "weekly", day: "sunday", time: "06:30", timezone: "Etc/UTC" }
    labels: ["dependencies", "python", "dependabot"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
